services:
  postgres:
    image: postgres:16-alpine
    container_name: collct-dev-postgres
    environment:
      POSTGRES_USER: collct
      POSTGRES_PASSWORD: collct
      POSTGRES_DB: collct
    ports:
      - "5432:5432"
    volumes:
      - ./dev/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collct -d collct"]
      interval: 2s
      timeout: 3s
      retries: 10