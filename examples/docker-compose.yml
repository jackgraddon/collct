version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: collct
      POSTGRES_USER: collct
      POSTGRES_PASSWORD: collct
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collct -d collct"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main application
  app:
    image: jackgraddon/collct:latest
    ports:
      - "3000:3000"
    environment:
      # Database configuration
      - DATABASE_URL=postgresql://collct:collct@db:5432/collct
      
      # Session configuration (generate with: openssl rand -hex 32)
      - NUXT_SESSION_PASSWORD=
      
      # Blob storage directory
      - COLLCT_BLOB_DIR=./data/blob
      
      # Registration & access settings
      - COLLCT_ALLOW_REGISTRATION=yes
      - COLLCT_PUBLIC_GROUP_ENABLED=true
      
      # Instance branding
      - COLLCT_INSTANCE_NAME=Collct
      - COLLCT_INSTANCE_DESCRIPTION=A friends-first photo sharing app. No algorithm. No tracking. No strangers.
      
      # Session management
      - COLLCT_SESSION_MAX_AGE=2592000
      - COLLCT_SESSION_SECURE=true
      - COLLCT_SESSION_SAME_SITE=lax
      
      # Authentication
      - COLLCT_REQUIRE_EMAIL_VERIFICATION=false
      
      # Feature flags
      - COLLCT_NOTIFICATIONS_ENABLED=true
      - COLLCT_COMMENTS_ENABLED=true
      - COLLCT_OFFLINE_MODE_ENABLED=true
      
      # Third-party client access
      - COLLCT_ALLOWED_ORIGINS=https://collct.domain.app
      - COLLCT_APP_URL=https://collct.domain.app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data

volumes:
  postgres_data: